<!DOCTYPE html>
<html>
<head>
  <title>My To-Do App</title>
  <style>
  body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    margin-top: 50px;
  }

  .container {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    text-align: center;
  }

  input {
    padding: 10px;
    width: 70%;
    border: none;
    border-radius: 5px;
  }

  button {
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  li {
    background: #334155;
    margin-top: 10px;
    padding: 10px;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>

<body>

  <body>

  <div class="container">
    <h1>My To-Do App</h1>

    <input type="text" id="taskInput" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
  </div>

</body>

  <script>
  let tasks = [];

  function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value;

    if (task === "") return;

    tasks.push(task);
    saveTasks();
    displayTasks();

    input.value = "";
  }

  function displayTasks() {
    let list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
      let li = document.createElement("li");

      let span = document.createElement("span");
      span.textContent = task;

      span.onclick = function() {
        span.style.textDecoration = "line-through";
      };

      let btn = document.createElement("button");
      btn.textContent = "Delete";
      btn.onclick = function() {
        tasks.splice(index, 1);
        saveTasks();
        displayTasks();
      };

      li.appendChild(span);
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  function saveTasks() {
    localStorage.setItem("myTasks", JSON.stringify(tasks));
  }

  function loadTasks() {
    let saved = localStorage.getItem("myTasks");
    if (saved) {
      tasks = JSON.parse(saved);
    }
    displayTasks();
  }

  // run when page loads
  loadTasks();
  </script>

</body>
</html>
